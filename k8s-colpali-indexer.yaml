apiVersion: apps/v1
kind: Deployment
metadata:
  name: colpali-vlm-indexer
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: colpali-vlm-indexer
  template:
    metadata:
      labels:
        app: colpali-vlm-indexer
    spec:
      containers:
        - name: colpali-worker
          image: ghcr.io/pradeeptalari14/colpali-rag:v1.2.0
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
